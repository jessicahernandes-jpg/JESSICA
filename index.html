<!DOCTYPE html>
<html lang="pt-brasil">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meublocktcke</title>


<style>
    header {
        background-color: #163c63;
        color: #a3365b;
        text-align: center;
        margin: auto 0;
    }

    main {
        background-color: #f4f3f7;
        color: #052442;
        color: #a3365b;
        text-align: center;
        margin: auto 0;
        padding: 16px;
        border: 5px solid #ee95b2;
        display: flex;

    }

    img {
        width 80px;
        height 80px;
    }

    .autore-autor {
    font-weight: bold;

    
    }

</style>

</head>

<body>
    <header>
        <h1>Meu Blog Tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia</p>
    </header>
    <main>
        <img src="meu bloque.jpg" alt="meu blog">

        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: jessica </p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de
                tecnologia.
            </p>
            <button>❤️ <span>0</span></button>
            <button>👍 <span>0</span></button>
        </div>
    </main>
</body>

<script>
  const botoes = document.querySelectorAll("button");

  botoes.forEach(function (botao) {
    botao.addEventListener("click", botaoClicado);

    function botaoClicado() {
      console.log("fui clicado");
      let texto = botao.querySelector("span");
      texto.textContent++;
    }
  });
</script>

</html>
